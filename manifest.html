<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>TisaJets — Passenger Information</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',sans-serif;background:#f0f3f8;color:#1a1a2e;min-height:100vh}

/* HEADER */
.hdr{background:#0F1835;padding:26px 20px 22px;text-align:center}
.hdr-logo{font-size:20px;font-weight:700;color:#C5920D;letter-spacing:2px;margin-bottom:10px}
.hdr-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:6px}
.hdr-sub{font-size:13px;color:rgba(255,255,255,.65);line-height:1.55}

/* FLIGHT BANNER */
.flt-banner{background:#fff;border-radius:12px;margin:16px 16px 0;padding:14px 16px;border-left:4px solid #C5920D;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.flt-ref{font-size:13px;font-weight:700;color:#0F1835;margin-bottom:3px}
.flt-det{font-size:12px;color:#64748b;line-height:1.5}

/* PASSENGER CARDS */
.pax-card{background:#fff;border-radius:12px;margin:12px 16px 0;box-shadow:0 1px 6px rgba(0,0,0,.06);overflow:hidden}
.pax-hdr{display:flex;align-items:center;padding:15px 16px;cursor:pointer;gap:12px;-webkit-tap-highlight-color:transparent;min-height:56px}
.pax-badge{width:30px;height:30px;border-radius:50%;background:#0F1835;color:#C5920D;font-size:13px;font-weight:700;display:grid;place-items:center;flex-shrink:0}
.pax-lbl{flex:1;font-size:14px;font-weight:500;color:#1a1a2e}
.pax-lbl.mt{color:#94a3b8}
.pax-body{padding:4px 16px 18px;border-top:1px solid #f1f5f9}
.pax-body.hid{display:none}
.chev{flex-shrink:0;color:#94a3b8;transition:transform .2s}
.chev.op{transform:rotate(180deg)}

/* FIELDS */
.fg{margin-top:14px}
.fg label{display:block;font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.fg input,.fg select{width:100%;padding:13px 14px;border:1.5px solid #e2e8f0;border-radius:10px;font-family:'Poppins',sans-serif;font-size:16px;background:#fff;color:#1a1a2e;outline:none;-webkit-appearance:none;appearance:none}
.fg input:focus,.fg select:focus{border-color:#C5920D}
.fg input.err,.fg select.err{border-color:#ef4444}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt-note{font-size:11px;color:#94a3b8;margin-top:3px}

/* SUBMIT */
.submit-area{padding:20px 16px 48px}
.confirm-wrap{display:flex;align-items:flex-start;gap:12px;background:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 1px 6px rgba(0,0,0,.06);margin-bottom:16px;cursor:pointer}
.confirm-wrap input[type=checkbox]{width:20px;height:20px;flex-shrink:0;margin-top:1px;accent-color:#C5920D;cursor:pointer}
.confirm-wrap span{font-size:13px;color:#475569;line-height:1.55}
.err-bar{background:#fee2e2;color:#991b1b;border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:14px;display:none}
.sub-btn{width:100%;padding:16px;background:#C5920D;color:#fff;border:none;border-radius:12px;font-family:'Poppins',sans-serif;font-size:16px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sub-btn:disabled{opacity:.55;cursor:not-allowed}

/* SUCCESS */
#success{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px;text-align:center;background:#f0f3f8}
.ok-ring{width:80px;height:80px;border-radius:50%;background:#d1fae5;display:grid;place-items:center;margin:0 auto 24px}
.ok-h{font-size:22px;font-weight:700;color:#0F1835;margin-bottom:12px}
.ok-p{font-size:14px;color:#64748b;line-height:1.65;max-width:340px}
.ok-logo{font-size:14px;font-weight:600;color:#C5920D;letter-spacing:1px;margin-top:36px}
</style>
</head>
<body>

<!-- hidden form for CORS-free submission -->
<iframe name="hf" style="display:none"></iframe>
<form id="hform" method="GET" target="hf" style="display:none">
  <input name="token"/><input name="action"/><input name="ref"/><input name="passengers"/><input name="submitted_at"/>
</form>

<!-- FORM -->
<div id="form-screen">
  <div class="hdr">
    <div class="hdr-logo">TISAJETS</div>
    <div class="hdr-title">Passenger Information</div>
    <div class="hdr-sub" id="hdr-sub">Please fill in the details for all passengers.</div>
  </div>

  <div class="flt-banner">
    <div class="flt-ref" id="flt-ref">Loading flight details…</div>
    <div class="flt-det" id="flt-det"></div>
  </div>

  <div id="pax-wrap"></div>

  <div class="submit-area">
    <label class="confirm-wrap">
      <input type="checkbox" id="conf"/>
      <span>I confirm all information is accurate and matches the travel documents.</span>
    </label>
    <div class="err-bar" id="err-bar"></div>
    <button class="sub-btn" id="sub-btn" onclick="doSubmit()">Submit Passenger Details</button>
  </div>
</div>

<!-- SUCCESS -->
<div id="success">
  <div class="ok-ring">
    <svg width="38" height="38" fill="none" stroke="#065f46" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
  </div>
  <div class="ok-h">Thank you.</div>
  <div class="ok-p">Your passenger details have been submitted.<br/>TisaJets will be in touch with your flight confirmation.</div>
  <div class="ok-logo">TISAJETS</div>
</div>

<script>
const APPS='https://script.google.com/macros/s/AKfycbwbDVYoiy2gg42CH29Z8IZzaPAKEC4WXfUJ6ybD4G6xcqDRq4gJ5xrbd3sjqAOS2jB2vA/exec'
const SECRET='tisa-jets-9f3kP2xQwL8mNvR7'

const qp=new URLSearchParams(location.search)
const REF=qp.get('ref')||'TJ-F-001'
const PAX=Math.min(Math.max(parseInt(qp.get('pax'))||1,1),19)
const ROUTE=decodeURIComponent(qp.get('route')||'')
const FDATE=qp.get('date')||''
const CLIENT=decodeURIComponent(qp.get('client')||'')

// Header
document.getElementById('hdr-sub').textContent='Please fill in the details for all '+PAX+' passenger'+(PAX!==1?'s':'')+'.'
document.getElementById('flt-ref').textContent='Flight: '+REF
const det=[]
if(ROUTE)det.push('Route: '+ROUTE)
if(FDATE)det.push('Date: '+fmtDate(FDATE))
document.getElementById('flt-det').textContent=det.join('  ·  ')

function fmtDate(d){
  if(!d)return''
  const mon=['January','February','March','April','May','June','July','August','September','October','November','December']
  const[y,m,da]=d.split('-');return parseInt(da)+' '+mon[parseInt(m)-1]+' '+y
}

// Build cards
const wrap=document.getElementById('pax-wrap')
for(let i=0;i<PAX;i++) wrap.insertAdjacentHTML('beforeend',mkCard(i))

function mkCard(i){
  const open=i===0
  return`<div class="pax-card" id="card${i}">
  <div class="pax-hdr" onclick="tog(${i})">
    <div class="pax-badge">${i+1}</div>
    <div class="pax-lbl mt" id="lbl${i}">Passenger ${i+1}</div>
    <svg class="chev${open?' op':''}" id="chev${i}" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
  </div>
  <div class="pax-body${open?'':' hid'}" id="body${i}">
    <div class="frow">
      <div class="fg"><label>First Name *</label><input type="text" id="p${i}fn" autocomplete="given-name" placeholder="As on passport" oninput="upd(${i})"/></div>
      <div class="fg"><label>Last Name *</label><input type="text" id="p${i}ln" autocomplete="family-name" placeholder="As on passport" oninput="upd(${i})"/></div>
    </div>
    <div class="fg"><label>Date of Birth *</label><input type="date" id="p${i}dob"/></div>
    <div class="fg"><label>Passport Number *</label><input type="text" id="p${i}pp" autocomplete="off" placeholder="e.g. AB123456"/></div>
    <div class="frow">
      <div class="fg"><label>Nationality *</label><input type="text" id="p${i}nat" placeholder="e.g. Belgian"/></div>
      <div class="fg"><label>Gender *</label><select id="p${i}gen"><option value="">Select…</option><option>Male</option><option>Female</option></select></div>
    </div>
    <div class="fg"><label>Weight (kg)</label><input type="number" id="p${i}wt" placeholder="Optional" min="20" max="300"/><div class="opt-note">Helpful for weight & balance — optional</div></div>
  </div>
</div>`
}

function tog(i){
  const b=document.getElementById('body'+i),c=document.getElementById('chev'+i)
  const isHid=b.classList.toggle('hid');c.classList.toggle('op',isHid)
}
function upd(i){
  const fn=g('p'+i+'fn'),ln=g('p'+i+'ln'),el=document.getElementById('lbl'+i)
  if(fn||ln){el.textContent=(fn+' '+ln).trim();el.classList.remove('mt')}
  else{el.textContent='Passenger '+(i+1);el.classList.add('mt')}
}
function g(id){return(document.getElementById(id)?.value||'').trim()}

async function doSubmit(){
  hideErr()
  if(!document.getElementById('conf').checked){showErr('Please confirm the information is accurate before submitting.');return}

  const pax=[];let bad=-1
  for(let i=0;i<PAX;i++){
    const fn=g('p'+i+'fn'),ln=g('p'+i+'ln'),dob=g('p'+i+'dob'),pp=g('p'+i+'pp'),nat=g('p'+i+'nat'),gen=g('p'+i+'gen'),wt=g('p'+i+'wt')
    if(!fn||!ln||!dob||!pp||!nat||!gen){
      if(bad<0)bad=i
      document.getElementById('body'+i).classList.remove('hid')
      document.getElementById('chev'+i).classList.add('op')
    }
    pax.push({full_name:fn+' '+ln,dob,passport:pp,nationality:nat,gender:gen,weight:wt})
  }
  if(bad>=0){showErr('Please fill in all required fields for every passenger.');document.getElementById('card'+bad).scrollIntoView({behavior:'smooth',block:'start'});return}

  const btn=document.getElementById('sub-btn')
  btn.textContent='Submitting…';btn.disabled=true

  try{
    const f=document.getElementById('hform')
    f.action=APPS
    f.elements[0].value=SECRET
    f.elements[1].value='manifest_submit'
    f.elements[2].value=REF
    f.elements[3].value=JSON.stringify(pax)
    f.elements[4].value=new Date().toISOString()
    f.submit()
  }catch(e){console.warn('submit:',e)}

  document.getElementById('form-screen').style.display='none'
  document.getElementById('success').style.display='flex'
}

function showErr(m){const e=document.getElementById('err-bar');e.textContent=m;e.style.display='block';e.scrollIntoView({behavior:'smooth',block:'center'})}
function hideErr(){document.getElementById('err-bar').style.display='none'}
</script>
</body>
</html>
