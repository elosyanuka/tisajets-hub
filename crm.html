<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TISA Jets CRM</title>
<style>
  :root {
    --bg: #f7f8fb;
    --panel: #ffffff;
    --border: #e4e7ec;
    --text: #101828;
    --muted: #667085;
    --accent: #1f4ed8;
    --accent-soft: #eef2ff;
    --success: #027a48;
    --success-soft: #ecfdf3;
    --warning: #b54708;
    --warning-soft: #fffaeb;
    --danger: #b42318;
    --danger-soft: #fef3f2;
    --shadow: 0 1px 2px rgba(16,24,40,0.04), 0 1px 3px rgba(16,24,40,0.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.45;
  }
  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }

  /* Sidebar */
  .sidebar {
    background: #0b1739;
    color: #cfd5e6;
    padding: 20px 16px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 24px; color: white;
  }
  .brand-logo {
    width: 32px; height: 32px; border-radius: 8px;
    background: linear-gradient(135deg, #4f6df5, #1f4ed8);
    display: grid; place-items: center; font-weight: 700;
  }
  .brand-name { font-weight: 600; font-size: 15px; letter-spacing: 0.2px; }
  .brand-sub { font-size: 11px; color: #8b94ad; }

  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 8px;
    cursor: pointer; color: #cfd5e6; font-size: 13px;
    user-select: none;
  }
  .nav-item:hover { background: rgba(255,255,255,0.06); color: white; }
  .nav-item.active { background: rgba(79,109,245,0.18); color: white; }
  .nav-item .icon { width: 16px; height: 16px; opacity: 0.9; }
  .nav-spacer { flex: 1; }
  .user-card {
    display: flex; align-items: center; gap: 10px;
    padding: 10px; border-radius: 10px;
    background: rgba(255,255,255,0.04);
  }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: #4f6df5; color: white;
    display: grid; place-items: center;
    font-weight: 600; font-size: 12px;
  }
  .user-name { color: white; font-size: 13px; font-weight: 500; }
  .user-role { font-size: 11px; color: #8b94ad; }

  /* Main */
  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    height: 60px; background: white;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center;
    padding: 0 28px; gap: 16px;
  }
  .topbar h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .topbar .search {
    flex: 1; max-width: 420px;
    position: relative;
  }
  .topbar .search input {
    width: 100%; padding: 8px 12px 8px 34px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); font-size: 13px;
    outline: none;
  }
  .topbar .search input:focus { border-color: var(--accent); background: white; }
  .topbar .search svg {
    position: absolute; left: 10px; top: 9px;
    width: 16px; height: 16px; color: var(--muted);
  }
  .content { padding: 24px 28px; flex: 1; overflow-y: auto; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 8px;
    font-size: 13px; font-weight: 500;
    border: 1px solid var(--border); background: white;
    cursor: pointer; color: var(--text);
    transition: all 0.15s;
  }
  .btn:hover { background: var(--bg); }
  .btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
  .btn-primary:hover { background: #1740b8; }
  .btn-danger { color: var(--danger); border-color: #fecdca; }
  .btn-danger:hover { background: var(--danger-soft); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-icon {
    padding: 6px; width: 30px; height: 30px;
    display: grid; place-items: center;
  }

  /* Cards / panels */
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
  }
  .card-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  .card-header h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .card-body { padding: 16px 20px; }
  .card-body.no-pad { padding: 0; }

  /* Dashboard stats */
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 16px; margin-bottom: 24px;
  }
  .stat {
    background: white; border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px;
    box-shadow: var(--shadow);
  }
  .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; font-weight: 500; }
  .stat-value { font-size: 26px; font-weight: 700; margin-top: 6px; }
  .stat-trend { font-size: 12px; color: var(--muted); margin-top: 4px; }

  /* Tables */
  table { width: 100%; border-collapse: collapse; }
  th, td {
    text-align: left; padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  th {
    background: var(--bg); color: var(--muted);
    font-weight: 500; font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.4px;
  }
  tr:last-child td { border-bottom: none; }
  tr.row-hover:hover { background: var(--bg); cursor: pointer; }

  /* Badges */
  .badge {
    display: inline-flex; align-items: center;
    padding: 3px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 500;
    background: var(--bg); color: var(--muted);
  }
  .badge-lead { background: #f0f4ff; color: #1f4ed8; }
  .badge-qualified { background: #ecfdf3; color: #027a48; }
  .badge-proposal { background: #fffaeb; color: #b54708; }
  .badge-negotiation { background: #fdf4ff; color: #9333ea; }
  .badge-won { background: #ecfdf3; color: #027a48; }
  .badge-lost { background: var(--danger-soft); color: var(--danger); }

  /* Pipeline kanban */
  .kanban {
    display: grid; grid-template-columns: repeat(6, minmax(220px, 1fr));
    gap: 14px; overflow-x: auto; padding-bottom: 8px;
  }
  .kanban-col {
    background: var(--bg);
    border-radius: 10px;
    padding: 12px;
    min-height: 400px;
  }
  .kanban-col-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px; font-size: 12px; font-weight: 600;
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px;
  }
  .kanban-count {
    background: white; border: 1px solid var(--border);
    padding: 1px 8px; border-radius: 999px; font-size: 11px;
  }
  .deal-card {
    background: white; border: 1px solid var(--border);
    border-radius: 8px; padding: 12px; margin-bottom: 8px;
    cursor: pointer; transition: all 0.15s;
  }
  .deal-card:hover { border-color: var(--accent); box-shadow: var(--shadow); }
  .deal-card.dragging { opacity: 0.4; }
  .deal-name { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  .deal-meta { font-size: 11px; color: var(--muted); }
  .deal-value { font-size: 13px; font-weight: 600; color: var(--success); margin-top: 6px; }

  /* Form / modal */
  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(16,24,40,0.5);
    display: none; align-items: center; justify-content: center;
    z-index: 100; padding: 24px;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: white; border-radius: 12px;
    width: 100%; max-width: 560px;
    max-height: 90vh; overflow-y: auto;
    box-shadow: 0 20px 25px rgba(0,0,0,0.2);
  }
  .modal-header {
    padding: 18px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-header h3 { margin: 0; font-size: 16px; }
  .modal-close { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--muted); padding: 0; line-height: 1; }
  .modal-body { padding: 20px 24px; }
  .modal-footer {
    padding: 14px 24px; border-top: 1px solid var(--border);
    display: flex; justify-content: flex-end; gap: 10px;
  }
  .form-row { display: grid; gap: 14px; }
  .form-row.two-col { grid-template-columns: 1fr 1fr; }
  label { font-size: 12px; color: var(--muted); font-weight: 500; display: block; margin-bottom: 4px; }
  input[type=text], input[type=email], input[type=tel], input[type=number], input[type=date], select, textarea {
    width: 100%; padding: 8px 12px;
    border: 1px solid var(--border); border-radius: 7px;
    font-size: 13px; font-family: inherit;
    background: white; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea { resize: vertical; min-height: 80px; }

  /* Detail panel */
  .detail-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }
  .detail-row { display: grid; grid-template-columns: 130px 1fr; padding: 9px 0; font-size: 13px; }
  .detail-row .lbl { color: var(--muted); font-size: 12px; }
  .timeline-item {
    padding: 12px 0; border-bottom: 1px solid var(--border);
    display: grid; grid-template-columns: auto 1fr; gap: 12px;
  }
  .timeline-item:last-child { border-bottom: none; }
  .timeline-dot {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center; font-size: 14px;
  }
  .timeline-title { font-size: 13px; font-weight: 500; }
  .timeline-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .timeline-body { font-size: 12px; color: var(--text); margin-top: 4px; }

  /* Misc */
  .empty {
    padding: 60px 20px; text-align: center; color: var(--muted);
  }
  .empty-title { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
  .checkbox { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .task-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); }
  .task-row.done .task-title { text-decoration: line-through; color: var(--muted); }
  .task-title { font-size: 13px; }
  .task-meta { font-size: 11px; color: var(--muted); }
  .due-soon { color: var(--warning); font-weight: 500; }
  .due-overdue { color: var(--danger); font-weight: 500; }
  .row-actions { display: flex; gap: 6px; }
  .filter-bar { display: flex; gap: 10px; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .filter-bar select { width: auto; min-width: 120px; }
  .filter-bar input { width: auto; min-width: 200px; }
  .tag { font-size: 11px; padding: 2px 7px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
  .urgency-badge { display: inline-flex; align-items: center; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 500; }
  .urgency-urgent { background: var(--warning-soft); color: var(--warning); }
  .urgency-very-urgent { background: var(--danger-soft); color: var(--danger); }
  hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

  /* Client classification */
  .class-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0; cursor: pointer; position: relative; vertical-align: middle;
  }
  .class-dot.cls-A { background: #12b76a; }
  .class-dot.cls-B { background: #f79009; }
  .class-dot.cls-C { background: #f04438; }
  .class-dot.cls-none { background: transparent; border: 1.5px dashed #d0d5dd; opacity: 0; transition: opacity 0.12s; }
  tr:hover .class-dot.cls-none { opacity: 1; }
  .class-dot[data-tip]:hover::after {
    content: attr(data-tip);
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    background: #101828; color: white; font-size: 11px; white-space: nowrap;
    padding: 3px 8px; border-radius: 5px; pointer-events: none; z-index: 50;
  }
  .class-filter-dot {
    width: 11px; height: 11px; border-radius: 50%; cursor: pointer;
    flex-shrink: 0; border: 2px solid transparent; transition: border-color 0.12s;
  }
  .class-filter-dot.cls-A { background: #12b76a; }
  .class-filter-dot.cls-B { background: #f79009; }
  .class-filter-dot.cls-C { background: #f04438; }
  .class-filter-dot.cls-active { border-color: #101828; }
  .cls-picker { display: flex; align-items: center; gap: 10px; padding-top: 4px; }
  .cls-picker-dot {
    width: 14px; height: 14px; border-radius: 50%; cursor: pointer;
    outline: 2px solid transparent; outline-offset: 2px; transition: outline-color 0.12s;
  }
  .cls-picker-dot.cls-A { background: #12b76a; }
  .cls-picker-dot.cls-B { background: #f79009; }
  .cls-picker-dot.cls-C { background: #f04438; }
  .cls-picker-dot.selected { outline-color: #101828; }

  /* Sync indicator */
  .sync-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 500;
    background: var(--bg); color: var(--muted);
    border: 1px solid var(--border);
    cursor: pointer; user-select: none;
  }
  .sync-pill:hover { background: white; }
  .sync-pill .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
  }
  .sync-pill.synced .dot { background: var(--success); }
  .sync-pill.syncing .dot { background: var(--accent); animation: pulse 1s infinite; }
  .sync-pill.error .dot { background: var(--danger); }
  .sync-pill.offline .dot { background: var(--warning); }
  .sync-pill.disabled .dot { background: var(--muted); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .toast {
    position: fixed; bottom: 20px; right: 20px;
    background: #101828; color: white;
    padding: 10px 16px; border-radius: 8px;
    font-size: 13px; z-index: 200;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    animation: toast-in 0.2s ease-out;
  }
  @keyframes toast-in { from { transform: translateY(20px); opacity: 0; } }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .sidebar {
      flex-direction: row; flex-wrap: nowrap; overflow-x: auto;
      padding: 6px 10px; gap: 2px;
      border-right: none; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .brand, .nav-spacer, .user-card { display: none; }
    .nav-item { flex-direction: column; padding: 6px 10px; font-size: 10px; gap: 2px; flex-shrink: 0; border-radius: 8px; white-space: nowrap; }
    .nav-item .icon { width: 18px; height: 18px; }
    .stats { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .detail-grid { grid-template-columns: 1fr; }
    .topbar { padding: 0 16px; }
    .topbar h1 { font-size: 15px; }
  }
  @media (max-width: 768px) {
    .kanban { display: flex; overflow-x: auto; gap: 12px; padding-bottom: 16px; -webkit-overflow-scrolling: touch; }
    .kanban-col { min-width: 260px; flex-shrink: 0; }
    .modal-bg { align-items: flex-end; }
    .modal { width: 100%; max-width: 100%; border-radius: 16px 16px 0 0; max-height: 90vh; overflow-y: auto; }
    .card-body { padding: 12px 14px; }
    table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    th, td { padding: 10px 12px; font-size: 12px; white-space: nowrap; }
    .main { padding: 16px; }
    .stat-value { font-size: 20px; }
    input, select, textarea { font-size: 16px !important; }
  }
</style>
</head>

</div>

<!-- Modal -->
<div class="modal-bg" id="modal">

    <div class="modal-header">
      <h3 id="modalTitle">New</h3>
      <button class="modal-close" id="modalClose">&times;</button>

    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn" id="modalCancel">Cancel</button>
      <button class="btn btn-primary" id="modalSave">Save</button>

</div>

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return JSON.parse(JSON.stringify(defaultData));
}
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function uid(prefix) { return prefix + Math.random().toString(36).slice(2, 9); }
function fmtMoney(n) { return '$' + (n || 0).toLocaleString(); }
function fmtDate(d) {
  if (!d) return '—';
  const date = new Date(d);
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function today() { return new Date().toISOString().slice(0, 10); }
function daysUntil(d) {
  if (!d) return null;
  const diff = (new Date(d) - new Date(today())) / (1000*60*60*24);
  return Math.round(diff);
}
function escapeHtml(s) { return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function findContact(id) { return state.contacts.find(c => c.id === id); }
function stageBadge(stage) {
  const cls = {Lead:'badge-lead',Qualified:'badge-qualified',Proposal:'badge-proposal',Negotiation:'badge-negotiation',Won:'badge-won',Lost:'badge-lost'}[stage] || '';
  return `<span class="badge ${cls}">${stage}</span>`;
}
function initials(name) {
  return (name||'').split(' ').map(p => p[0]).filter(Boolean).slice(0,2).join('').toUpperCase();
}

const SYNC_CONFIG_KEY = 'tisa_jets_crm_sync_v1';

const SYNC_DEFAULTS = {

  sharedSecret: 'tisa-jets-9f3kP2xQwL8mNvR7',
  enabled:      true,
};

function loadSyncConfig() {
  try {
    const raw = localStorage.getItem(SYNC_CONFIG_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { ...SYNC_DEFAULTS };
}

let syncConfig = loadSyncConfig();
let syncStatus = { state: 'disabled', message: 'Local only', lastSyncAt: null };
let pollTimer = null;
let pendingOps = []; // queue of {action, table, record/id} when offline

function saveSyncConfig() { localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(syncConfig)); }

function updateSyncPill() {
  const pill = document.getElementById('syncPill');
  const label = document.getElementById('syncLabel');
  if (!pill) return;
  pill.classList.remove('synced','syncing','error','offline','disabled');
  pill.classList.add(syncStatus.state);
  let text = syncStatus.message;
  if (syncStatus.state === 'synced' && syncStatus.lastSyncAt) {
    const ago = Math.round((Date.now() - syncStatus.lastSyncAt) / 1000);
    text = ago < 5 ? 'Synced just now' : ago < 60 ? `Synced ${ago}s ago` : `Synced ${Math.round(ago/60)}m ago`;
  }
  label.textContent = text;
}

async function syncRequest(method, body) {
  if (!syncConfig.enabled || !syncConfig.webAppUrl) throw new Error('Sync not configured');
  let url = syncConfig.webAppUrl;
  let opts = { method };
  if (method === 'GET') {
    url += (url.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(syncConfig.sharedSecret);
  } else {
    // Use text/plain to avoid CORS preflight (Apps Script can't respond to OPTIONS)
    opts.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
    opts.body = JSON.stringify({ ...body, token: syncConfig.sharedSecret });
  }
  const res = await fetch(url, opts);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}

async function syncPull(silent) {
  if (!syncConfig.enabled) return;
  try {
    if (!silent) { syncStatus = { state: 'syncing', message: 'Pulling…' }; updateSyncPill(); }
    const json = await syncRequest('GET');
    const data = json.data || {};
    ['contacts','deals','tasks','activities'].forEach(t => {
      if (Array.isArray(data[t])) state[t] = data[t];
    });
    saveState();
    syncStatus = { state: 'synced', message: 'Synced', lastSyncAt: Date.now() };
    updateSyncPill();
    if (currentView) rerender();
  } catch(err) {
    syncStatus = { state: 'error', message: 'Sync error: ' + err.message };
    updateSyncPill();
  }
}

async function syncUpsert(table, record) {
  if (!syncConfig.enabled) return;
  record.updatedAt = new Date().toISOString();
  try {
    syncStatus = { state: 'syncing', message: 'Saving…' }; updateSyncPill();
    await syncRequest('POST', { action: 'upsert', table, record });
    syncStatus = { state: 'synced', message: 'Synced', lastSyncAt: Date.now() };
    updateSyncPill();
  } catch(err) {
    pendingOps.push({ action: 'upsert', table, record });
    syncStatus = { state: 'offline', message: 'Offline (queued)' };
    updateSyncPill();
  }
}

async function syncDelete(table, id) {
  if (!syncConfig.enabled) return;
  try {
    syncStatus = { state: 'syncing', message: 'Deleting…' }; updateSyncPill();
    await syncRequest('POST', { action: 'delete', table, id });
    syncStatus = { state: 'synced', message: 'Synced', lastSyncAt: Date.now() };
    updateSyncPill();
  } catch(err) {
    pendingOps.push({ action: 'delete', table, id });
    syncStatus = { state: 'offline', message: 'Offline (queued)' };
    updateSyncPill();
  }
}

async function syncBulkPush() {
  if (!syncConfig.enabled) { toast('Configure sync first'); return; }
  try {
    syncStatus = { state: 'syncing', message: 'Pushing all data…' }; updateSyncPill();
    await syncRequest('POST', { action: 'bulk_replace', state });
    syncStatus = { state: 'synced', message: 'Synced', lastSyncAt: Date.now() };
    updateSyncPill();
    toast('All data pushed to Google Sheet');
  } catch(err) {
    syncStatus = { state: 'error', message: 'Push failed: ' + err.message };
    updateSyncPill();
    toast('Push failed: ' + err.message);
  }
}

async function flushPendingOps() {
  if (pendingOps.length === 0) return;
  const ops = pendingOps.slice();
  pendingOps = [];
  for (const op of ops) {
    try {
      await syncRequest('POST', op);
    } catch(e) {
      pendingOps.push(op);
      return; // stop on first failure
    }
  }
  syncStatus = { state: 'synced', message: 'Synced', lastSyncAt: Date.now() };
  updateSyncPill();
}

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  if (!syncConfig.enabled) return;
  pollTimer = setInterval(() => {
    flushPendingOps().then(() => syncPull(true));
  }, 30000);
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2800);
}

async function testConnection() {
  const url = document.getElementById('f_url').value.trim();
  const secret = document.getElementById('f_secret').value.trim();
  if (!url || !secret) { toast('Enter URL and secret first'); return; }
  const oldConfig = { ...syncConfig };
  syncConfig = { webAppUrl: url, sharedSecret: secret, enabled: true };
  try {
    await syncRequest('GET');
    saveSyncConfig();
    syncStatus = { state: 'synced', message: 'Connected', lastSyncAt: Date.now() };
    updateSyncPill();
    toast('✓ Connection successful — sync is on');
    startPolling();
    openSyncSettings(); // refresh modal
  } catch(err) {
    syncConfig = oldConfig;
    toast('✗ Connection failed: ' + err.message);
  }
}

function disconnectSync() {
  if (!confirm('Disconnect from Google Sheets? Your local data stays here.')) return;
  syncConfig = { webAppUrl: '', sharedSecret: '', enabled: false };
  saveSyncConfig();
  syncStatus = { state: 'disabled', message: 'Local only' };
  updateSyncPill();
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  closeModal();
}

function renderTasks() {
  document.getElementById('pageTitle').textContent = 'Tasks';
  const q = (document.getElementById('globalSearch').value || '').toLowerCase();
  const filter = state._taskFilter || 'open';
  let tasks = state.tasks.slice();
  if (filter === 'open') tasks = tasks.filter(t => !t.done);
  else if (filter === 'done') tasks = tasks.filter(t => t.done);
  else if (filter === 'overdue') tasks = tasks.filter(t => !t.done && daysUntil(t.dueDate) < 0);
  if (q) tasks = tasks.filter(t => t.title.toLowerCase().includes(q));
  tasks.sort((a,b) => (a.dueDate||'').localeCompare(b.dueDate||''));

  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="filter-bar">
        <strong style="font-size:13px;">${tasks.length} tasks</strong>
        <span style="flex:1;"></span>
        <select id="taskFilter">
          <option value="open" ${filter==='open'?'selected':''}>Open</option>
          <option value="overdue" ${filter==='overdue'?'selected':''}>Overdue</option>
          <option value="done" ${filter==='done'?'selected':''}>Completed</option>
          <option value="all" ${filter==='all'?'selected':''}>All</option>
        </select>
        <button class="btn btn-primary btn-sm" onclick="openTaskModal()">+ Add Task</button>
      </div>
      <div>
        ${tasks.length === 0 ? '<div class="empty"><div class="empty-title">No tasks</div><div>Click "Add Task" to create one</div></div>' :
        tasks.map(t => {
          const dn = daysUntil(t.dueDate);
          const cls = t.done ? '' : (dn < 0 ? 'due-overdue' : dn <= 2 ? 'due-soon' : '');
          const contact = findContact(t.contactId);
          return `<div class="task-row ${t.done ? 'done' : ''}">
            <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask('${t.id}')"/>
            <div onclick="openTaskModal('${t.id}')" style="cursor:pointer;">
              <div class="task-title">${escapeHtml(t.title)}</div>
              <div class="task-meta">${contact ? escapeHtml(contact.name) + ' • ' : ''}<span class="${cls}">${fmtDate(t.dueDate)}</span>${t.owner ? ' • ' + escapeHtml(t.owner) : ''}${t.urgency && t.urgency !== 'not-urgent' ? ` • <span class="urgency-badge urgency-${t.urgency}">${t.urgency === 'very-urgent' ? 'Very Urgent' : 'Urgent'}</span>` : ''}</div>
            </div>
            <div class="row-actions">
              <button class="btn btn-sm" onclick="openTaskModal('${t.id}')">Edit</button>
              <button class="btn btn-sm btn-danger" onclick="deleteTask('${t.id}')">Delete</button>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
  const sel = document.getElementById('taskFilter');
  if (sel) sel.onchange = (e) => { state._taskFilter = e.target.value; renderTasks(); };
}

function closeModal() { document.getElementById('modal').classList.remove('open'); modalContext = null; }

function saveModal() {
  if (!modalContext) return;
  const t = modalContext.type;
  const id = modalContext.id;
  const val = (k) => { const el = document.getElementById(k); return el ? el.value : ''; };

  if (t === 'sync') {
    const url = val('f_url').trim();
    const secret = val('f_secret').trim();
    if (!url || !secret) { toast('Enter URL and secret'); return; }
    syncConfig = { webAppUrl: url, sharedSecret: secret, enabled: true };
    saveSyncConfig();
    syncStatus = { state: 'synced', message: 'Connected', lastSyncAt: Date.now() };
    updateSyncPill();
    startPolling();
    closeModal();
    toast('Sync enabled. Click the sync pill anytime to test or push data.');
    return;
  }

  let savedObj = null, savedTable = null;
  if (t === 'contact') {
    const name = val('f_name').trim();
    if (!name) { alert('Name is required'); return; }
    const obj = {
      id: id || uid('c'),
      name, company: val('f_company'), email: val('f_email'),
      phone: val('f_phone'), role: val('f_role'), owner: val('f_owner'),
      tags: val('f_tags').split(',').map(s => s.trim()).filter(Boolean),
      notes: val('f_notes'),
      class: val('f_class') || '',
      createdAt: id ? findContact(id).createdAt : today(),
    };
    if (id) {
      const i = state.contacts.findIndex(c => c.id === id);
      state.contacts[i] = obj;
    } else state.contacts.push(obj);
    savedObj = obj; savedTable = 'contacts';
  } else if (t === 'deal') {
    const name = val('f_name').trim();
    if (!name) { alert('Deal name is required'); return; }
    const obj = {
      id: id || uid('d'),
      name, contactId: val('f_contact'), owner: val('f_owner'),
      value: Number(val('f_value')) || 0, stage: val('f_stage'),
      closeDate: val('f_closeDate'), notes: val('f_notes'),
    };
    if (id) {
      const i = state.deals.findIndex(d => d.id === id);
      state.deals[i] = obj;
    } else state.deals.push(obj);
    savedObj = obj; savedTable = 'deals';
  } else if (t === 'task') {
    const title = val('f_title').trim();
    if (!title) { alert('Title is required'); return; }
    const existing = id ? state.tasks.find(x => x.id === id) : null;
    const obj = {
      id: id || uid('t'),
      title, dueDate: val('f_dueDate'), owner: val('f_owner'),
      contactId: val('f_contact'), done: existing ? existing.done : false,
      urgency: val('f_urgency') || 'not-urgent',
      remindersSent: existing ? (existing.remindersSent || []) : [],
    };
    if (id) {
      const i = state.tasks.findIndex(x => x.id === id);
      state.tasks[i] = obj;
    } else state.tasks.push(obj);
    savedObj = obj; savedTable = 'tasks';
  } else if (t === 'activity') {
    const title = val('f_title').trim();
    if (!title) { alert('Title is required'); return; }
    const obj = {
      id: id || uid('a'),
      type: val('f_type'), title, contactId: val('f_contact'),
      body: val('f_body'), date: val('f_date'),
    };
    if (id) {
      const i = state.activities.findIndex(x => x.id === id);
      state.activities[i] = obj;
    } else state.activities.push(obj);
    savedObj = obj; savedTable = 'activities';
  }
  saveState();
  if (savedTable && savedObj) syncUpsert(savedTable, savedObj);
  closeModal();
  rerender();
}

/* =========================
   ACTIONS
   ========================= */
function deleteContact(id) {
  if (!confirm('Delete this contact? Their deals and activities will keep references but the contact link will break.')) return;
  state.contacts = state.contacts.filter(c => c.id !== id);
  saveState(); syncDelete('contacts', id); rerender();
}
function deleteDeal(id) {
  if (!confirm('Delete this deal?')) return;
  state.deals = state.deals.filter(d => d.id !== id);
  saveState(); syncDelete('deals', id);
  if (currentView === 'dealDetail') setView('deals'); else rerender();
}
function deleteTask(id) {
  if (!confirm('Delete this task?')) return;
  state.tasks = state.tasks.filter(t => t.id !== id);
  saveState(); syncDelete('tasks', id); rerender();
}
function toggleTask(id) {
  const t = state.tasks.find(x => x.id === id);
  if (t) { t.done = !t.done; saveState(); syncUpsert('tasks', t); rerender(); }
}
function openContact(id) { currentView = 'contactDetail'; currentDetailId = id; renderContactDetail(id); setNavActive('contacts'); }
function openDeal(id) { currentView = 'dealDetail'; currentDetailId = id; renderDealDetail(id); setNavActive('deals'); }

let currentDetailId = null;
function setView(v) {
  currentView = v;
  setNavActive(v);
  rerender();
}
function setNavActive(v) {
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.view === v);
  });
}
function rerender() {
  if (currentView === 'dashboard') renderDashboard();
  else if (currentView === 'contacts') renderContacts();
  else if (currentView === 'deals') renderDeals();
  else if (currentView === 'tasks') renderTasks();
  else if (currentView === 'contactDetail') renderContactDetail(currentDetailId);
  else if (currentView === 'dealDetail') renderDealDetail(currentDetailId);
}

/* =========================
   DRAG & DROP
   ========================= */
let draggedDealId = null;
function onDealDragStart(e) {
  draggedDealId = e.currentTarget.dataset.deal;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function onDealDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
}
function onDealDrop(e, stage) {
  e.preventDefault();
  if (!draggedDealId) return;
  const d = state.deals.find(x => x.id === draggedDealId);
  if (d && d.stage !== stage) {
    d.stage = stage;
    saveState();
    syncUpsert('deals', d);
    rerender();
  }
  draggedDealId = null;
}

/* =========================
   CLASSIFICATION
   ========================= */
function cycleContactClass(e, id) {
  e.stopPropagation();
  const c = findContact(id);
  if (!c) return;
  const cycle = { '': 'A', 'A': 'B', 'B': 'C', 'C': '' };
  c.class = cycle[c.class || ''];
  saveState();
  syncUpsert('contacts', c);
  rerender();
}

function setClassFilter(cls) {
  state._contactClassFilter = state._contactClassFilter === cls ? '' : cls;
  renderContacts();
}

function selectModalClass(cls) {
  const hidden = document.getElementById('f_class');
  const label  = document.getElementById('cls_label');
  if (!hidden) return;
  hidden.value = hidden.value === cls ? '' : cls;
  label.textContent = hidden.value ? 'Class ' + hidden.value : 'Unclassified';
  document.querySelectorAll('.cls-picker-dot').forEach(el => el.classList.remove('selected'));
  if (hidden.value) {
    const active = document.querySelector('.cls-picker-dot.cls-' + hidden.value);
    if (active) active.classList.add('selected');
  }
}

});
document.getElementById('modalClose').onclick = closeModal;
document.getElementById('modalCancel').onclick = closeModal;
document.getElementById('modalSave').onclick = saveModal;
document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal') closeModal();
});
document.getElementById('primaryAction').onclick = () => {
  if (currentView === 'contacts' || currentView === 'contactDetail') openContactModal();
  else if (currentView === 'deals' || currentView === 'dealDetail') openDealModal();
  else if (currentView === 'tasks') openTaskModal();
  else openContactModal();
};
document.getElementById('globalSearch').addEventListener('input', () => {
  if (['contacts','deals','tasks'].includes(currentView)) rerender();
});

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('globalSearch').focus();
  }
});

// Sync pill click
document.getElementById('syncPill').onclick = openSyncSettings;

// Initial render
rerender();

// Initialize sync if configured
if (syncConfig.enabled && syncConfig.webAppUrl) {
  syncStatus = { state: 'syncing', message: 'Connecting…' };
  updateSyncPill();
  syncPull().then(() => startPolling());
} else {
  updateSyncPill();
}
</script>
</body>
</html>
